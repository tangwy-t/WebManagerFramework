# ============================================================================
# OpenTelemetry Collector — 追踪侧配置（配合 docker compose --profile tracing）
#
# 拓扑：
#   server ──OTLP gRPC(4317)──► otel-collector ──gRPC(14317)──► jaeger(存储+UI)
#
# 说明：
#   - receivers.otlp.grpc 监听 0.0.0.0:4317，承接后端 otlptracegrpc(Insecure)上报。
#   - exporters.otlp 把数据上抽给同网络的 jaeger（grpc endpoint 14317）。
#   - 生产可在此追加/替换 exporters（Prometheus、云 APM、Kafka 等）。
# ============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      # 本后端只用 gRPC；如需兼收 HTTP(4318) 报告端可取消注释：
      # http:
      #   endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  # debug: 控制台打印 span（联调时便于快速确认有数据进入）。
  # 注意：`verbosity` 字段在新版 Collector 已废弃，日志级别由
  # service.telemetry.logs 统一控制，故这里不写 verbosity。
  debug:
  otlp/jaeger:
    endpoint: jaeger:14317    # jaeger 的 gRPC 接收端点（all-in-one 默认开启）
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]